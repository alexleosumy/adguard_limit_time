[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "family-time-manager"
version = "0.1.0"
description = "Universal service for managing daily access time to online services through AdGuard Home."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Oleksandr Nyzovyi" }
]

keywords = [
    "home-assistant",
    "adguard",
    "parental-control",
    "mqtt",
    "docker",
    "python",
    "roblox"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Internet",
    "Typing :: Typed"
]

dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.11.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "PyYAML>=6.0.2",
    "rich>=14.1.0",
    "structlog>=25.4.0",
    "typer>=0.17.4"
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.10.4",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
    "types-PyYAML>=6.0.12.20250516"
]

[project.scripts]
ftm = "ftm.__main__:main"

###############################################################################
# UV
###############################################################################

[tool.uv]
package = true

###############################################################################
# Hatch
###############################################################################

[tool.hatch.build.targets.wheel]
packages = ["src/ftm"]

###############################################################################
# Ruff
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",

    "I",

    "UP",

    "B",

    "SIM",

    "C4",

    "RET",

    "PTH",

    "ASYNC",

    "LOG",

    "RUF"
]

ignore = [
    "COM812",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

###############################################################################
# Mypy
###############################################################################

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

show_error_codes = true
pretty = true

namespace_packages = true

mypy_path = "src"

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

asyncio_mode = "auto"

addopts = [
    "--strict-markers",
    "--strict-config"
]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]

branch = true

source = [
    "src/ftm"
]

[tool.coverage.report]

show_missing = true

skip_empty = true

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
